# Site owner settings
# Customize these values to personalize your mixtape library

owner:
  name: "GreatCaptainA"
  email: "r.a.cristian.93@gmail.com"
  bio: "Music enthusiast sharing mixtapes since today."
  accepting_requests: true
  
  # Genre preferences for "What I Love" section
  genre_preferences:
    - "Big Beat / Breakbeat / Rave: The Chemical Brothers, The Prodigy, Baauer, Shy FX"
    - "House / Tech House / EDM: Barac, Dom Dolla, Matroda, Mau P, Steve Aoki, Alex Guesta, Party Favor, FISHER, Aatig"
    - "Electro Pop / Global / Novelty: Rise Of Artificial, PSY, Die Antwoord, Technotronic, Panjabi MC, Night Club, Puretone, Ma-Do, MELL, Jacknife Lee, AldiPower"
    - "Hardbass: DJ Blyatman, Hard Bass School, Alan Aztec, Davay"
    - "Hardstyle: S3RL, Gonzi, Elektronik Girl Epic, Chase & Status, Alfons"
    - "Classic Rock / Heavy Metal: Black Sabbath, Iron Maiden, AC/DC, Ozzy Osbourne, Mike Oldfield, The Alan Parsons Project"
    - "Nu Metal / Industrial / Alt Metal: Slipknot, Korn, Static-X, Rob Zombie, Godsmack, Dope"
    - "Garage / Punk / Alt Rock: The White Stripes, Spiderbait, Starcrawler, Peaches, Saliva, Apocalyptica, Implant pentru refuz"
  # Tape types you prefer to receive (use values from tape_options.yml)
  preferred_tape_types:
    - "type_i"
    - "type_ii"
  
  # Dolby options you prefer to receive (use values from tape_options.yml)
  preferred_dolby_options:
    - "none"
    - "dolby_b"
    - "dolby_c"

# Exchange policy
policy:
  description: "I'm happy to copy and exchange tapes with fellow enthusiasts! Please read the guidelines below."
  guidelines:
    - "I will ship only to EU"
    - "Allow as long as necessary for processing and shipping"
    - "I prefer exchanging a comparable number of tapes instead of purchases. But if you don't have tapes to exchange, I accept a small fee to cover the cost of blanks and shipping (see charges below)"
  
  # Monetary policy for special tape types
  charges:
    nos_tape: "5-10€ depending on available stock."
    old_tapes: "1-5€ depending on quality"
    digital_file: "Free - I'll send audio files for you to record yourself"
    shipping: "5-10€ depending on location and tape quantity. For exchanges we each cover our own costs."
    payment: "I accept bank transfer for tape purchases to cover the cost of blanks and shipping. Don't send any money until I confirm your request! For exchanges, I prefer equivalent swaps with no additional payment on either side."

# Theme customization
theme:
  primary_color: "#e63946"
  secondary_color: "#457b9d"
  background_color: "#f1faee"
  text_color: "#1d3557"
  accent_color: "#a8dadc"
  
  # Optional: header image URL (leave empty for solid color header)
  header_image: ""
  
  # Font choices (Google Fonts or system fonts)
  heading_font: "'Courier New', monospace"
  body_font: "'Helvetica Neue', Arial, sans-serif"

# Site metadata
site:
  show_tape_count: true
  enable_search: true
  enable_filtering: true
  display_samples: true